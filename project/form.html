<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Product review form" />
    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/form.js" defer></script>
    <script src="scripts/common.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>Product Review</h1>
            <p class="subtitle">Please complete the required fields to submit your review.</p>
        </div>
    </header>

    <main class="container">
        <!-- REQUIRED: method="get" + action="review.html" -->
        <form class="card form" method="get" action="review.html">
            <!-- Product Name (select, required, placeholder first option disabled+selected) -->
            <div class="field">
                <label for="product"><span class="req" aria-hidden="true">*</span> Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Dynamically populated by scripts/form.js -->
                </select>
            </div>

            <!-- Overall Rating (radios 1–5, same name, required) -->
            <fieldset class="card-soft">
                <legend><span class="req" aria-hidden="true">*</span> Overall Rating</legend>

                <p class="hint">
                    Note: all rating radios share the same <code>name="rating"</code> so only one can be selected and
                    one value is submitted.
                </p>

                <div class="rating" role="radiogroup" aria-label="Overall rating from 1 to 5">
                    <input required type="radio" id="r1" name="rating" value="1">
                    <label for="r1" aria-label="1 star">☆</label>

                    <input required type="radio" id="r2" name="rating" value="2">
                    <label for="r2" aria-label="2 stars">☆☆</label>

                    <input required type="radio" id="r3" name="rating" value="3">
                    <label for="r3" aria-label="3 stars">☆☆☆</label>

                    <input required type="radio" id="r4" name="rating" value="4">
                    <label for="r4" aria-label="4 stars">☆☆☆☆</label>

                    <input required type="radio" id="r5" name="rating" value="5">
                    <label for="r5" aria-label="5 stars">☆☆☆☆☆</label>
                </div>
            </fieldset>

            <!-- Date of Installation (required date input) -->
            <div class="field">
                <label for="installDate"><span class="req" aria-hidden="true">*</span> Date of Installation</label>
                <input required type="date" id="installDate" name="installDate">
            </div>

            <!-- Useful Features (checkboxes: id + name + value) -->
            <fieldset class="card-soft">
                <legend>Useful Features (check all that apply)</legend>

                <div class="checks">
                    <div class="check">
                        <input type="checkbox" id="feat1" name="features" value="Durable">
                        <label for="feat1">Durable</label>
                    </div>

                    <div class="check">
                        <input type="checkbox" id="feat2" name="features" value="Easy to Use">
                        <label for="feat2">Easy to Use</label>
                    </div>

                    <div class="check">
                        <input type="checkbox" id="feat3" name="features" value="Good Value">
                        <label for="feat3">Good Value</label>
                    </div>

                    <div class="check">
                        <input type="checkbox" id="feat4" name="features" value="Design">
                        <label for="feat4">Design</label>
                    </div>
                </div>
            </fieldset>

            <!-- Written Review (textarea, optional, id + name) -->
            <div class="field">
                <label for="writtenReview">Written Review (optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="5"
                    placeholder="Write your review here..."></textarea>
            </div>

            <!-- User Name (text input, optional, id + name) -->
            <div class="field">
                <label for="userName">Your Name (optional)</label>
                <input type="text" id="userName" name="userName" autocomplete="name" />
            </div>

            <!-- Submit -->
            <div class="actions">
                <input class="btn" type="submit" value="Submit Review" />
            </div>
        </form>
    </main>

    
    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; <span id="year"></span> | Selorm Dei-Kumah | WDD 131</p>
            <p>Last Modified: <span id="lastModified"></span></p>
        </div>
    </footer>
</body>

</html>
