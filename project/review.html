<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Review form confirmation" />
    <title>Review Confirmation</title>

    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/review.js" defer></script>
    <script src="scripts/common.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>Thank You!</h1>
            <p class="subtitle">Your review has been submitted successfully.</p>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Confirmation</h2>

            <p class="notice">
                Total reviews completed: <strong><span id="reviewCount">0</span></strong>
            </p>

            <div class="summary" aria-label="Submitted review summary">
                <h3>Submitted Info</h3>
                <ul>
                    <li><strong>Product:</strong> <span id="sumProduct">—</span></li>
                    <li><strong>Rating:</strong> <span id="sumRating">—</span></li>
                    <li><strong>Installation date:</strong> <span id="sumDate">—</span></li>
                </ul>
            </div>

            <p>
                <a class="btn-link" href="form.html">Submit another review</a>
            </p>
        </section>
    </main>

   
    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; <span id="year"></span> | Selorm Dei-Kumah | WDD 131</p>
            <p>Last Modified: <span id="lastModified"></span></p>
        </div>
    </footer>
</body>

</html>
