<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description" content="Temple Album page displaying a collection of temples from around the world.">
    <meta name="author" content="Selorm Dei-Kumah">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <h2>Temple Album</h2>

        <button id="menu-button">☰</button>

        <nav id="nav-menu">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>

        <h1>Temple Gallery</h1>

        <section class="gallery">

            <figure>
                <img src="images/saltlake.webp" alt="Temple">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rome.jpg" alt="Temple">
                <figcaption>Rome Temple</figcaption>
            </figure>

            <figure>
                <img src="images/paris.webp" alt="Temple">
                <figcaption>Paris Temple</figcaption>
            </figure>

            <figure>
                <img src="images/tokyo.webp" alt="Temple">
                <figcaption>Tokyo Temple</figcaption>
            </figure>

            <figure>
                <img src="images/mexico.webp" alt="Temple">
                <figcaption>Mexico City Temple</figcaption>
            </figure>

            <figure>
                <img src="images/london.webp" alt="Temple">
                <figcaption>London Temple</figcaption>
            </figure>

            <figure>
                <img src="images/accra.webp" alt="Temple">
                <figcaption>Accra Temple</figcaption>
            </figure>

            <figure>
                <img src="images/johanesburg.webp" alt="Temple">
                <figcaption>Johannesburg Temple</figcaption>
            </figure>

            <figure>
                <img src="images/manila.webp" alt="Temple">
                <figcaption>Manila Temple</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>© <span id="year"></span> | Selorm Dei-Kumah</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</html>
