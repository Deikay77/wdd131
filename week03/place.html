<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="Ghana place page (WDD 131) featuring key data and a weather section with wind chill." />
    <meta name="author" content="Selorm Dei-Kumah" />
    <title>Ghana | Place Page</title>

    <link rel="stylesheet" href="styles/place.css" />
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Ghana</h1>
    </header>

    <div class="accent-bar" aria-hidden="true"></div>

    <main class="page">
        <!-- HERO / Layout container -->
        <section class="hero" aria-label="Ghana hero section">
            <!-- REQUIRED: srcset responsive method + WebP images -->
            <img class="hero-img" src="images/hero-1200.webp" srcset="
          images/hero-400.webp 400w,
          images/hero-800.webp 800w,
          images/hero-1200.webp 1200w
        " sizes="(max-width: 500px) 400px, (max-width: 900px) 800px, 1200px" alt="A scenic view representing Ghana"
                width="1200" height="700" loading="eager" />

            <!-- DATA card -->
            <section class="card data" aria-label="Ghana data">
                <h2 class="card-title">Data</h2>

                <dl class="kv">
                    <div>
                        <dt>Area</dt>
                        <dd>238,535 km²</dd>
                    </div>
                    <div>
                        <dt>Population</dt>
                        <dd>33,000,000</dd>
                    </div>
                    <div>
                        <dt>Capital</dt>
                        <dd>Accra</dd>
                    </div>
                    <div>
                        <dt>Languages</dt>
                        <dd>English</dd>
                    </div>
                    <div>
                        <dt>Currency</dt>
                        <dd>Ghanaian Cedi (GHS)</dd>
                    </div>
                    <div>
                        <dt>Time Zone</dt>
                        <dd>UTC</dd>
                    </div>
                    <div>
                        <dt>Calling Code</dt>
                        <dd>+233</dd>
                    </div>
                    <div>
                        <dt>Internet TLD</dt>
                        <dd>.gh</dd>
                    </div>
                </dl>
            </section>

            <!-- WEATHER card -->
            <section class="card weather" aria-label="Ghana weather">
                <h2 class="card-title weather-title">Weather</h2>

                <!-- REQUIRED: SVG icon for mobile view -->
                <img class="weather-icon" src="images/weather-icon.svg" alt="Partly cloudy weather icon" width="56"
                    height="56" loading="lazy" />

                <!-- Static displayed values (JS uses these) -->
                <dl class="kv">
                    <div>
                        <dt>Temperature</dt>
                        <dd><span id="temperature">10</span> °C</dd>
                    </div>
                    <div>
                        <dt>Conditions</dt>
                        <dd>Partly Cloudy</dd>
                    </div>
                    <div>
                        <dt>Wind</dt>
                        <dd><span id="windspeed">5</span> km/h</dd>
                    </div>
                    <div>
                        <dt>Wind Chill</dt>
                        <dd><span id="windchill">—</span></dd>
                    </div>
                </dl>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="year"></span> Rubia M. Francesco | Ghana</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
